<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryVerse - Cinematic Stories Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090a0f',
                        cardBg: '#12141c',
                        goldAccent: '#d4af37',
                        goldHover: '#e5c158'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090a0f; color: #e2e8f0; }
        h1, h2, h3, .cinzel-font { font-family: 'Cinzel', serif; }
        .hero-bg {
            background: linear-gradient(to bottom, rgba(9, 10, 15, 0.4), rgba(9, 10, 15, 0.95)), 
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-goldAccent selection:text-black">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-darkBg/80 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 rounded-full border border-goldAccent flex items-center justify-center bg-goldAccent/10 text-goldAccent font-bold text-xl">SV</div>
                <div>
                    <span class="text-xl sm:text-2xl font-black tracking-widest text-white cinzel-font">STORYVERSE</span>
                    <span class="block text-[10px] tracking-widest text-goldAccent uppercase font-semibold">Cinematic Edition</span>
                </div>
            </div>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium">
                <button onclick="router.navigate('home')" class="text-white hover:text-goldAccent transition">Home</button>
                <button onclick="router.navigate('stories')" class="text-gray-400 hover:text-goldAccent transition">Explore</button>
                <button onclick="router.navigate('categories')" class="text-gray-400 hover:text-goldAccent transition">Categories</button>
                <button onclick="router.navigate('about')" class="text-gray-400 hover:text-goldAccent transition">About</button>
            </nav>
            <div class="flex items-center space-x-4">
                <input type="text" placeholder="Search stories..." oninput="handleSearch(this.value)" class="hidden sm:block bg-cardBg border border-white/10 rounded-full py-2 px-4 text-xs text-white focus:outline-none focus:border-goldAccent w-48">
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="appContent" class="flex-grow flex items-center justify-center py-20">
        <div class="text-goldAccent text-center">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
            <p class="text-xs tracking-wider uppercase">Loading StoryVerse Archive...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-cardBg border-t border-white/10 mt-20 py-8 text-center text-xs text-gray-500">
        <p>© 2026 STORYVERSE. JSON-Driven GitHub Pages Ready.</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        let appData = {
            categories: [
                { id: 'creative', name: 'Creative', icon: 'fa-feather-pointed', desc: 'Imaginative fantasy & fiction', color: 'from-purple-600 to-indigo-600' },
                { id: 'islamic', name: 'Islamic', icon: 'fa-mosque', desc: 'Wisdom, prophets & faith', color: 'from-emerald-600 to-teal-600' },
                { id: 'horror', name: 'Horror', icon: 'fa-ghost', desc: 'Chilling paranormal thrillers', color: 'from-red-600 to-rose-900' },
                { id: 'funny', name: 'Funny', icon: 'fa-face-laugh-beam', desc: 'Lighthearted comedy & wit', color: 'from-amber-500 to-orange-600' },
                { id: 'moral', name: 'Moral', icon: 'fa-scale-balanced', desc: 'Lessons that shape character', color: 'from-blue-600 to-cyan-600' },
                { id: 'motivational', name: 'Motivational', icon: 'fa-mountain-sun', desc: 'Rise above all obstacles', color: 'from-yellow-500 to-amber-600' }
            ],
            stories: []
        };

        // Fetch JSON Data dynamically
        async function loadStories() {
            try {
                const response = await fetch('data/stories.json');
                appData.stories = await response.json();
                router.navigate('home');
            } catch (error) {
                console.error('Error fetching stories:', error);
                document.getElementById('appContent').innerHTML = `<p class="text-red-400 text-xs">Error loading stories.json. Please check file path.</p>`;
            }
        }

        const router = {
            currentRoute: 'home',
            param: null,
            navigate(route, param = null) {
                this.currentRoute = route;
                this.param = param;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            },
            render() {
                const container = document.getElementById('appContent');
                if (this.currentRoute === 'home') container.innerHTML = renderHomePage();
                else if (this.currentRoute === 'stories') container.innerHTML = renderStoriesPage();
                else if (this.currentRoute === 'categories') container.innerHTML = renderCategoriesPage();
                else if (this.currentRoute === 'category-detail') container.innerHTML = renderCategoryDetailPage(this.param);
                else if (this.currentRoute === 'story-detail') container.innerHTML = renderStoryDetailPage(this.param);
                else if (this.currentRoute === 'about') container.innerHTML = renderAboutPage();
            }
        };

        function renderHomePage() {
            const featured = appData.stories.find(s => s.featured) || appData.stories[0];
            const latest = appData.stories.slice(0, 4);
            return `
                <div class="w-full">
                    <section class="relative hero-bg py-28 border-b border-white/10 mb-12">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <div class="max-w-2xl">
                                <span class="py-1 px-3 rounded-full bg-goldAccent/10 border border-goldAccent/30 text-goldAccent text-xs font-semibold uppercase tracking-widest mb-4 inline-block">Cinematic Platform</span>
                                <h1 class="text-4xl sm:text-6xl font-black text-white mb-6 cinzel-font">IMMERSE IN EPIC TALES.</h1>
                                <button onclick="router.navigate('story-detail', ${featured ? featured.id : 1})" class="bg-gradient-to-r from-amber-500 to-goldAccent text-black font-bold px-8 py-3 rounded-full text-xs uppercase tracking-wider">Read Featured Story</button>
                            </div>
                        </div>
                    </section>
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <h2 class="text-2xl font-bold text-white cinzel-font mb-6">Latest Releases</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                            ${latest.map(story => renderCard(story)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStoriesPage() {
            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
                    <h1 class="text-3xl font-bold text-white cinzel-font mb-6">All Stories Archive</h1>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${appData.stories.map(story => renderCard(story)).join('')}
                    </div>
                </div>
            `;
        }

        function renderCategoriesPage() {
            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
                    <h1 class="text-3xl font-bold text-white cinzel-font mb-6">Categories</h1>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        ${appData.categories.map(cat => `
                            <div onclick="filterCategory('${cat.name}')" class="bg-cardBg border border-white/10 p-6 rounded-2xl cursor-pointer hover:border-goldAccent transition">
                                <h3 class="text-lg font-bold text-white cinzel-font mb-1">${cat.name}</h3>
                                <p class="text-xs text-gray-400">${cat.desc}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCategoryDetailPage(catName) {
            const filtered = appData.stories.filter(s => s.category.toLowerCase() === catName.toLowerCase());
            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
                    <button onclick="router.navigate('categories')" class="text-xs text-goldAccent mb-4 inline-block"><i class="fa-solid fa-arrow-left"></i> Back to Categories</button>
                    <h1 class="text-3xl font-bold text-white cinzel-font mb-6">${catName} Stories</h1>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        ${filtered.map(story => renderCard(story)).join('')}
                    </div>
                </div>
            `;
        }

        function renderStoryDetailPage(id) {
            const story = appData.stories.find(s => s.id === Number(id)) || appData.stories[0];
            return `
                <div class="max-w-3xl mx-auto px-4 py-10 w-full">
                    <button onclick="router.navigate('home')" class="text-xs text-goldAccent mb-4 inline-block"><i class="fa-solid fa-arrow-left"></i> Back to Home</button>
                    <span class="bg-goldAccent/10 text-goldAccent px-3 py-1 rounded-full text-xs uppercase font-semibold">${story.category}</span>
                    <h1 class="text-3xl sm:text-4xl font-bold text-white cinzel-font my-4">${story.title}</h1>
                    <img src="${story.image}" class="w-full h-80 object-cover rounded-2xl mb-6 border border-white/10">
                    <div class="bg-cardBg p-6 rounded-2xl border border-white/10 space-y-4 text-sm text-gray-300">
                        <p class="font-semibold text-white italic">${story.summary}</p>
                        <p class="whitespace-pre-line">${story.content}</p>
                        ${story.moral ? `<div class="bg-darkBg p-4 rounded-xl border border-goldAccent/30 text-goldAccent text-xs"><strong>Moral:</strong> ${story.moral}</div>` : ''}
                    </div>
                </div>
            `;
        }

        function renderAboutPage() {
            return `<div class="max-w-2xl mx-auto p-10 text-center"><h1 class="text-3xl font-bold text-white cinzel-font mb-4">About StoryVerse</h1><p class="text-xs text-gray-400">A completely static, JSON-driven story platform ready for GitHub Pages.</p></div>`;
        }

        function renderCard(story) {
            return `
                <div onclick="router.navigate('story-detail', ${story.id})" class="bg-cardBg border border-white/10 hover:border-goldAccent/50 rounded-2xl overflow-hidden cursor-pointer transition flex flex-col justify-between group">
                    <div>
                        <div class="h-44 overflow-hidden"><img src="${story.image}" class="w-full h-full object-cover group-hover:scale-105 transition"></div>
                        <div class="p-4">
                            <span class="text-[10px] text-goldAccent uppercase font-bold">${story.category}</span>
                            <h3 class="text-sm font-bold text-white cinzel-font mt-1 line-clamp-1">${story.title}</h3>
                            <p class="text-xs text-gray-400 line-clamp-2 mt-1">${story.summary}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 text-[11px] text-gray-500 border-t border-white/5 flex justify-between">
                        <span>${story.date}</span>
                        <span class="text-goldAccent font-semibold">Read &rarr;</span>
                    </div>
                </div>
            `;
        }

        function filterCategory(name) { router.navigate('category-detail', name); }
        function handleSearch(q) {
            if (!q.trim()) return;
            const res = appData.stories.filter(s => s.title.toLowerCase().includes(q.toLowerCase()));
            document.getElementById('appContent').innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-10 w-full">
                    <h1 class="text-2xl font-bold text-white cinzel-font mb-6">Search Results for "${q}"</h1>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">${res.map(s => renderCard(s)).join('')}</div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', loadStories);
    </script>
</body>
</html>
