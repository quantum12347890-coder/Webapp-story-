<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryVerse | Editorial & Cinematic Stories</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        canvas: '#0b0f19',
                        surface: '#111827',
                        surfaceHover: '#1f2937',
                        accent: '#6366f1',
                        accentHover: '#4f46e5',
                        subtleText: '#9ca3af'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .editorial-font { font-family: 'Playfair Display', serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-accent selection:text-white">

    <!-- Navbar -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-canvas/80 border-b border-gray-800/80">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer group" onclick="router.navigate('home')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-accent to-indigo-400 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-accent/20 group-hover:scale-105 transition">
                    SV
                </div>
                <span class="text-xl font-extrabold tracking-tight text-white editorial-font">StoryVerse.</span>
            </div>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-300">
                <button onclick="router.navigate('home')" class="hover:text-white transition">Discover</button>
                <button onclick="router.navigate('stories')" class="hover:text-white transition">All Tales</button>
                <button onclick="router.navigate('categories')" class="hover:text-white transition">Genres</button>
            </nav>
            <div class="flex items-center space-x-3">
                <div class="relative hidden sm:block">
                    <input type="text" placeholder="Search stories..." oninput="handleSearch(this.value)" class="bg-surface border border-gray-800 rounded-full py-2 pl-10 pr-4 text-xs text-white focus:outline-none focus:border-accent w-48 transition">
                    <i class="fa-solid fa-search absolute left-3.5 top-3 text-gray-500 text-xs"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="appContent" class="flex-grow max-w-6xl mx-auto px-6 py-12 w-full">
        <div class="flex flex-col items-center justify-center py-32 text-gray-400">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl text-accent mb-3"></i>
            <p class="text-xs uppercase tracking-widest font-semibold">Crafting Experience...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800/80 bg-surface/30 mt-20 py-10 text-center text-xs text-gray-500">
        <p>© 2026 StoryVerse Inc. Designed for immersive storytelling.</p>
    </footer>

    <!-- App Logic & Embedded Data -->
    <script>
        let appData = {
            categories: [
                { id: 'creative', name: 'Creative', desc: 'Imaginative fantasy & fiction', icon: 'fa-feather' },
                { id: 'islamic', name: 'Islamic', desc: 'Wisdom, prophets & faith', icon: 'fa-moon' },
                { id: 'horror', name: 'Horror', desc: 'Chilling paranormal thrillers', icon: 'fa-ghost' },
                { id: 'motivational', name: 'Motivational', desc: 'Rise above all obstacles', icon: 'fa-bolt' }
            ],
            stories: [
                {
                    id: 1,
                    title: "The Citadel of Solangels",
                    category: "Creative",
                    summary: "High above the shimmering coast, a golden bull stands guard over the eternal city against encroaching shadows.",
                    content: "In the sprawling golden metropolis nestled between mystic mountain ranges, the grand citadel hummed with ancient energy. Citizens walked beneath amber streetlamps while distant melodies echoed from royal plazas...\n\nEvery corner of the city held whispers of a forgotten era, where guardians of light protected the realm from eternal night.",
                    image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80",
                    moral: "True strength lies in unity and guarding the inner light.",
                    date: "Aug 19, 2026",
                    featured: true
                },
                {
                    id: 2,
                    title: "The Merchant's Pure Trust",
                    category: "Islamic",
                    summary: "An honest trader discovers that genuine wealth is measured by charity, patience, and absolute trust in the divine.",
                    content: "In the bustling markets of ancient Baghdad, Tariq was known as the most honest spice merchant. One evening, a weary traveler left behind a pouch adorned with brilliant emeralds...\n\nInstead of keeping it, Tariq tracked the traveler down for three days across the desert dunes.",
                    image: "https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=1200&q=80",
                    moral: "Integrity is the highest currency in both worlds.",
                    date: "Aug 18, 2026",
                    featured: false
                },
                {
                    id: 3,
                    title: "Echoes in the Iron Lighthouse",
                    category: "Horror",
                    summary: "A solitary keeper hears rhythmic footsteps climbing the spiral iron staircase precisely at midnight.",
                    content: "The Black Rock Lighthouse had been dark for fifty years. Ignoring local superstitions, Liam took the job of restoring the beacon. On his third night, the heavy oak door creaked open of its own accord...",
                    image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80",
                    moral: "Some doors from the past are best left securely locked.",
                    date: "Aug 17, 2026",
                    featured: false
                }
            ]
        };

        const router = {
            currentRoute: 'home',
            param: null,
            navigate(route, param = null) {
                this.currentRoute = route;
                this.param = param;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            },
            render() {
                const container = document.getElementById('appContent');
                if (this.currentRoute === 'home') container.innerHTML = renderHomePage();
                else if (this.currentRoute === 'stories') container.innerHTML = renderStoriesPage();
                else if (this.currentRoute === 'categories') container.innerHTML = renderCategoriesPage();
                else if (this.currentRoute === 'story-detail') container.innerHTML = renderStoryDetailPage(this.param);
                else if (this.currentRoute === 'category-detail') container.innerHTML = renderCategoryDetailPage(this.param);
            }
        };

        function renderHomePage() {
            const featured = appData.stories.find(s => s.featured) || appData.stories[0];
            const regularStories = appData.stories.filter(s => s.id !== featured.id);

            return `
                <div class="space-y-16">
                    <!-- Hero Section -->
                    <div onclick="router.navigate('story-detail', ${featured.id})" class="relative rounded-3xl overflow-hidden bg-surface border border-gray-800 cursor-pointer group transition hover:border-gray-700 shadow-2xl">
                        <div class="grid grid-cols-1 lg:grid-cols-12 items-center">
                            <div class="lg:col-span-7 p-8 sm:p-12 space-y-4">
                                <div class="flex items-center space-x-2">
                                    <span class="px-3 py-1 rounded-full bg-accent/10 text-accent font-semibold text-[10px] tracking-wider uppercase">${featured.category}</span>
                                    <span class="text-gray-500 text-xs">• ${featured.date}</span>
                                </div>
                                <h1 class="text-3xl sm:text-4xl font-bold text-white editorial-font group-hover:text-accent transition leading-tight">${featured.title}</h1>
                                <p class="text-sm text-gray-400 line-clamp-3 leading-relaxed">${featured.summary}</p>
                                <div class="pt-2 flex items-center text-xs font-bold text-accent">
                                    <span>Read Featured Story</span>
                                    <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition"></i>
                                </div>
                            </div>
                            <div class="lg:col-span-5 h-72 lg:h-full min-h-[300px] overflow-hidden">
                                <img src="${featured.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            </div>
                        </div>
                    </div>

                    <!-- Categories Row -->
                    <div>
                        <h3 class="text-xs font-bold tracking-widest text-gray-400 uppercase mb-6">Explore Genres</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            ${appData.categories.map(cat => `
                                <div onclick="router.navigate('category-detail', '${cat.name}')" class="bg-surface/60 border border-gray-800/80 hover:border-accent/50 p-5 rounded-2xl cursor-pointer transition text-center group">
                                    <div class="w-10 h-10 mx-auto rounded-xl bg-accent/10 text-accent flex items-center justify-center mb-3 group-hover:scale-110 transition">
                                        <i class="fa-solid ${cat.icon}"></i>
                                    </div>
                                    <h4 class="text-sm font-bold text-white mb-1">${cat.name}</h4>
                                    <p class="text-[11px] text-gray-500 line-clamp-1">${cat.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Recent Stories Grid -->
                    <div>
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-xs font-bold tracking-widest text-gray-400 uppercase">Latest Publications</h3>
                            <button onclick="router.navigate('stories')" class="text-xs text-accent hover:underline font-semibold">View All</button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${appData.stories.map(s => renderCard(s)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStoriesPage() {
            return `
                <div class="space-y-8">
                    <div>
                        <h1 class="text-3xl font-bold text-white editorial-font mb-2">All Publications</h1>
                        <p class="text-xs text-gray-400">Browse through our complete collection of handpicked tales.</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${appData.stories.map(s => renderCard(s)).join('')}
                    </div>
                </div>
            `;
        }

        function renderCategoriesPage() {
            return `
                <div class="space-y-8">
                    <h1 class="text-3xl font-bold text-white editorial-font mb-2">Story Genres</h1>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        ${appData.categories.map(cat => `
                            <div onclick="router.navigate('category-detail', '${cat.name}')" class="bg-surface border border-gray-800 hover:border-accent p-8 rounded-3xl cursor-pointer transition group">
                                <div class="w-12 h-12 rounded-2xl bg-accent/10 text-accent flex items-center justify-center mb-4 text-lg">
                                    <i class="fa-solid ${cat.icon}"></i>
                                </div>
                                <h3 class="text-xl font-bold text-white editorial-font mb-2">${cat.name}</h3>
                                <p class="text-xs text-gray-400 mb-4">${cat.desc}</p>
                                <span class="text-xs text-accent font-bold flex items-center">Explore Genre <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition"></i></span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCategoryDetailPage(catName) {
            const filtered = appData.stories.filter(s => s.category.toLowerCase() === catName.toLowerCase());
            return `
                <div class="space-y-8">
                    <button onclick="router.navigate('categories')" class="text-xs text-accent hover:underline flex items-center space-x-1">
                        <i class="fa-solid fa-arrow-left"></i><span>Back to Genres</span>
                    </button>
                    <h1 class="text-3xl font-bold text-white editorial-font">${catName} Stories</h1>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${filtered.map(s => renderCard(s)).join('')}
                    </div>
                </div>
            `;
        }

        function renderStoryDetailPage(id) {
            const story = appData.stories.find(s => s.id === Number(id)) || appData.stories[0];
            return `
                <div class="max-w-3xl mx-auto space-y-8">
                    <button onclick="router.navigate('home')" class="text-xs text-accent hover:underline flex items-center space-x-1">
                        <i class="fa-solid fa-arrow-left"></i><span>Back to Home</span>
                    </button>
                    
                    <div class="space-y-4">
                        <div class="flex items-center space-x-3 text-xs text-gray-400">
                            <span class="px-3 py-1 rounded-full bg-accent/10 text-accent font-semibold uppercase">${story.category}</span>
                            <span>• ${story.date}</span>
                        </div>
                        <h1 class="text-3xl sm:text-5xl font-bold text-white editorial-font leading-tight">${story.title}</h1>
                    </div>

                    <div class="rounded-3xl overflow-hidden border border-gray-800 h-80 sm:h-[420px]">
                        <img src="${story.image}" class="w-full h-full object-cover">
                    </div>

                    <div class="bg-surface border border-gray-800 rounded-3xl p-8 sm:p-12 space-y-6 text-sm sm:text-base text-gray-300 leading-relaxed shadow-xl">
                        <p class="font-semibold text-white text-lg italic border-l-2 border-accent pl-4">${story.summary}</p>
                        <div class="whitespace-pre-line text-gray-300">${story.content}</div>
                        
                        ${story.moral ? `
                            <div class="bg-canvas border border-accent/30 rounded-2xl p-6 mt-6">
                                <h4 class="text-accent font-bold text-xs uppercase tracking-wider mb-1"><i class="fa-solid fa-lightbulb mr-2"></i>Key Takeaway</h4>
                                <p class="text-gray-200 text-sm italic">${story.moral}</p>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function renderCard(story) {
            return `
                <div onclick="router.navigate('story-detail', ${story.id})" class="bg-surface border border-gray-800 hover:border-gray-700 rounded-2xl overflow-hidden cursor-pointer transition transform hover:-translate-y-1 flex flex-col justify-between group shadow-lg">
                    <div>
                        <div class="h-48 overflow-hidden relative">
                            <img src="${story.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <span class="absolute top-3 left-3 bg-canvas/80 backdrop-blur-md text-accent text-[10px] font-bold px-3 py-1 rounded-full uppercase">
                                ${story.category}
                            </span>
                        </div>
                        <div class="p-6 space-y-2">
                            <h3 class="text-base font-bold text-white editorial-font group-hover:text-accent transition line-clamp-1">${story.title}</h3>
                            <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed">${story.summary}</p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 pt-0 flex items-center justify-between text-[11px] text-gray-500 border-t border-gray-800/60 pt-4">
                        <span>${story.date}</span>
                        <span class="text-accent font-semibold flex items-center space-x-1 group-hover:translate-x-1 transition">
                            <span>Read</span>
                            <i class="fa-solid fa-arrow-right text-[10px]"></i>
                        </span>
                    </div>
                </div>
            `;
        }

        function handleSearch(query) {
            if (!query.trim()) { router.navigate('home'); return; }
            const res = appData.stories.filter(s => s.title.toLowerCase().includes(query.toLowerCase()) || s.summary.toLowerCase().includes(query.toLowerCase()));
            const container = document.getElementById('appContent');
            container.innerHTML = `
                <div class="space-y-6">
                    <h1 class="text-2xl font-bold text-white editorial-font">Search Results for "${query}"</h1>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${res.length ? res.map(s => renderCard(s)).join('') : '<p class="text-xs text-gray-500">No matching stories found.</p>'}
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            router.navigate('home');
        });
    </script>
</body>
</html>
